openapi: 3.0.3
info:
  title: SwiftServe Service Requests API
  version: 0.1.0
  description: Development API for service requests. Data is currently stored in memory and is not production-ready.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/jobs:
    get:
      summary: List service requests
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/Status' }
          description: Optional status filter.
      responses:
        '200': { description: Service requests returned. }
        '400': { description: Invalid status filter. }
    post:
      summary: Create a service request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJob' }
      responses:
        '201': { description: Service request created. }
        '400': { description: Malformed JSON. }
        '422': { description: Validation failed. }
  /api/v1/jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a service request
      responses:
        '200': { description: Request returned. }
        '404': { description: Request not found. }
    patch:
      summary: Update a service request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateJob' }
      responses:
        '200': { description: Request updated. }
        '404': { description: Request not found. }
        '422': { description: Validation failed. }
    delete:
      summary: Delete a service request
      responses:
        '204': { description: Request deleted. }
        '404': { description: Request not found. }
components:
  schemas:
    Status:
      type: string
      enum: [pending, accepted, completed, cancelled]
    Service:
      type: string
      enum: [cleaning, laundry, electrical, plumbing, ac-repair, appliance-repair, errand]
    CreateJob:
      type: object
      required: [service, description, area]
      properties:
        service: { $ref: '#/components/schemas/Service' }
        description: { type: string, minLength: 10, maxLength: 500 }
        area: { type: string, minLength: 2, maxLength: 80 }
    UpdateJob:
      type: object
      minProperties: 1
      properties:
        service: { $ref: '#/components/schemas/Service' }
        description: { type: string, minLength: 10, maxLength: 500 }
        area: { type: string, minLength: 2, maxLength: 80 }
        status: { $ref: '#/components/schemas/Status' }
